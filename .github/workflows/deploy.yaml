name: Deploy

on:
  push:
    branches:
    - stable
  workflow_dispatch:

jobs:
  deploy:
    environment: server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: build nixos config
      run: nixos/build.sh
    - name: push new config
      env:
        SSH_KEY: ${{secrets.SSH_KEY}}
      run: |
        echo $SSH_KEY > ssh.key
        ssh -p666 -o "IdentitiesOnly=yes" -i ssh.key cicd@192.168.42.152
