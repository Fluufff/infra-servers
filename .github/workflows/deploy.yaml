name: Deploy

on:
  push:
    branches:
    - stable
  workflow_dispatch:

jobs:
  deploy:
    environment: server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/determinate-nix-action@v3.13.2
    - name: push new config
      env:
        SSH_KEY: ${{secrets.SSH_KEY}}
      run: |
        echo $SSH_KEY > ssh.key
        ssh-add ssh.key
        nix run .#colmena -- apply --on pawhost-next
